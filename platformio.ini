; Flight Radar de escritorio - ESP32 WROOM/WROVER (dual-core) + TFT ILI9341 2.4" con touch XPT2046
; https://docs.platformio.org/page/projects/configuration.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Los mapas pre-renderizados (data/*.bin) viven en la particion "spiffs".
; Se suben aparte del firmware con:  pio run -t uploadfs
; Se usa LittleFS y no SPIFFS porque SPIFFS esta deprecado y es mas lento.
board_build.filesystem = littlefs

; Dos slots de 1,5 MB para poder actualizar por WiFi, ver partitions_ota.csv.
; El firmware ocupa ~1,19 MB, asi que entra con 25% de margen.
; OJO: la particion spiffs quedo en el mismo lugar que en huge_app, asi que al
; cambiar de tabla NO hizo falta volver a subir los mapas con uploadfs.
; Historico del esquema anterior:
; huge_app: 3 MB para la app y 896 KB de spiffs, sin slot OTA (que no usabamos).
; Con el esquema default la app tenia 1,31 MB y ya estabamos al 83%; el portal
; web + DNS + mDNS no entraban. Los mapas ocupan 271 KB, asi que sobran de los
; 896 KB. OJO: cambiar de esquema mueve la particion spiffs de 0x290000 a
; 0x310000, asi que hay que volver a correr "pio run -t uploadfs" una vez.
; La particion nvs sigue en 0x9000 en los dos esquemas, asi que la calibracion
; del touch y la config guardada sobreviven al cambio.
board_build.partitions = partitions_ota.csv

; Sin esto, "pio test" no compila los .cpp de src/ y solo linkea lo que ya
; era header-only (inline): las pruebas de StrUtils/GeoUtils pasaban igual,
; pero en cuanto un test referencia algo definido en un .cpp real -como
; OpenSkyClient::nextBackoffMs()- el link falla con "undefined reference" sin
; ningun error de compilacion que lo explique. PlatformIO NO excluye solo el
; archivo con setup()/loop() (main.cpp): por eso va envuelto en
; #ifndef UNIT_TEST en src/app/main.cpp, la macro que PlatformIO define solo
; al compilar para test.
test_build_src = yes

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.1.0

	; Unity la usa SOLO test/. Va declarada igual porque, si no, cada "pio run"
	; la borra de .pio/libdeps por considerarla una dependencia sin usar y el
	; siguiente "pio test" muere con un TypeError de SCons sobre unity.c. El
	; firmware no la linkea: el LDF solo compila las librerias cuyos headers se
	; incluyen, y unity.h no aparece en src/.
	throwtheswitch/Unity@^2.6.1

build_flags =
	; src/ en el include path. Los .cpp se incluyen entre si por ruta modular
	; ("core/DisplayManager.h"): PlatformIO ya agrega src/ solo al compilar el
	; firmware, pero no al compilar lo de test/, asi que va explicito para que
	; los tests encuentren los mismos headers que el firmware.
	-I src

	; --- Configuración de TFT_eSPI para ILI9341 240x320 + touch XPT2046 ---
	; Pinout confirmado por el usuario (ESP32 WROOM/WROVER):
	;   CS=15  RESET=4  DC=2  MOSI(SDI)=23  SCK=18  MISO(SDO)=19  LED=21
	;   T_CS=5  T_IRQ=17  (T_CLK/T_DIN/T_DO comparten bus con SCK/MOSI/MISO)
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=5
	; GPIO17 (T_IRQ) no lo usa TFT_eSPI por defecto; queda libre para leerlo
	; a mano si en el futuro querés detectar toques por interrupción.
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_TOUCH_FREQUENCY=2500000
