; Flight Radar de escritorio - ESP32 WROOM/WROVER (dual-core) + TFT ILI9341 2.4" con touch XPT2046
; https://docs.platformio.org/page/projects/configuration.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Los mapas pre-renderizados (data/*.bin) viven en la particion "spiffs".
; Se suben aparte del firmware con:  pio run -t uploadfs
; Se usa LittleFS y no SPIFFS porque SPIFFS esta deprecado y es mas lento.
board_build.filesystem = littlefs

; huge_app: 3 MB para la app y 896 KB de spiffs, sin slot OTA (que no usamos).
; Con el esquema default la app tenia 1,31 MB y ya estabamos al 83%; el portal
; web + DNS + mDNS no entraban. Los mapas ocupan 271 KB, asi que sobran de los
; 896 KB. OJO: cambiar de esquema mueve la particion spiffs de 0x290000 a
; 0x310000, asi que hay que volver a correr "pio run -t uploadfs" una vez.
; La particion nvs sigue en 0x9000 en los dos esquemas, asi que la calibracion
; del touch y la config guardada sobreviven al cambio.
board_build.partitions = huge_app.csv

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.1.0

build_flags =
	; --- Configuración de TFT_eSPI para ILI9341 240x320 + touch XPT2046 ---
	; Pinout confirmado por el usuario (ESP32 WROOM/WROVER):
	;   CS=15  RESET=4  DC=2  MOSI(SDI)=23  SCK=18  MISO(SDO)=19  LED=21
	;   T_CS=5  T_IRQ=17  (T_CLK/T_DIN/T_DO comparten bus con SCK/MOSI/MISO)
	-D USER_SETUP_LOADED=1
	-D ILI9341_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=320
	-D TFT_MISO=19
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TFT_BL=21
	-D TFT_BACKLIGHT_ON=HIGH
	-D TOUCH_CS=5
	; GPIO17 (T_IRQ) no lo usa TFT_eSPI por defecto; queda libre para leerlo
	; a mano si en el futuro querés detectar toques por interrupción.
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_TOUCH_FREQUENCY=2500000
